# One-click deploy on Render (https://render.com) — free tier works.
# Push this repo to GitHub, then: New > Blueprint > pick the repo.
services:
  - type: web
    name: vision-eye-screening
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 7860
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
